name: analysis-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install analysis package
        run: python -m pip install -e '.[test]'
      - name: Validate Python sources
        run: python -m compileall -q src tests scripts
      - name: Validate committed JSON
        run: |
          python -m json.tool configs/humanevalplus_public.json >/dev/null
          python -m json.tool results/humanevalplus/summary.json >/dev/null
          python -m json.tool results/internal/project_summary.json >/dev/null
      - name: Run regression tests
        run: pytest -q
