name: analysis-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install analysis package
        run: python -m pip install -e '.[test]'
      - name: Validate Python sources
        run: python -m compileall -q src tests scripts
      - name: Validate committed JSON
        run: |
          python -m json.tool configs/humanevalplus_public.json >/dev/null
          python -m json.tool results/humanevalplus/summary.json >/dev/null
          python -m json.tool results/internal/project_summary.json >/dev/null
      - name: Run regression tests
        run: pytest -q
      - name: Recompute archived HumanEvalPlus pass-at-k
        run: |
          SOURCE_SHA=645e89d2846930c74d3f8e85e5a25e6ec1abefdb
          ROOT=https://raw.githubusercontent.com/samat2003/meta-cognition/${SOURCE_SHA}/outputs/v040
          curl --fail --silent --show-error --location "${ROOT}/eval_base/candidate_outcomes.csv" --output /tmp/base_candidates.csv
          curl --fail --silent --show-error --location "${ROOT}/eval_instruct/candidate_outcomes.csv" --output /tmp/instruct_candidates.csv
          python scripts/recompute_archived_humanevalplus.py \
            --base /tmp/base_candidates.csv \
            --instruct /tmp/instruct_candidates.csv \
            --n 8 --k 1 2 4 8 \
            --out /tmp/corrected_pass_at_k.json
          cat /tmp/corrected_pass_at_k.json
