name: analysis-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install analysis package
        run: python -m pip install -e '.[test]'
      - name: Run regression tests
        run: pytest -q
